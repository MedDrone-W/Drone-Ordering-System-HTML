<!DOCTYPE html> <!-- lets users know it's HTML -->

<html> <!-- contains all the HTML code between the opening and closing tags (HTML) -->

<head>
    <title>My Website</title> <!-- Sets the title of the webpage that appears in the browser tab -->
</head>

<body style="background-color: lightgray;"> <!-- Contains the content of the webpage that is visible to users -->
    <h1>Welcome to My Website</h1> <!-- Main heading of the webpage -->    <!-- h1 sets the largest heading size with num decrease = decrease text size -->
    <hr> <!-- A horizontal line to separate content -->
